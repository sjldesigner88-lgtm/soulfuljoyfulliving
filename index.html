<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soulful Joyful Living — Coming Back Soon</title>
  <meta name="description" content="Soulful Joyful Living is getting a fresh new home. We'll be back soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      color: #4a3f3a;
      background: linear-gradient(160deg, #fbf6ef 0%, #f6e9e1 55%, #eadfd0 100%);
      text-align: center;
    }
    main { max-width: 34rem; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 1.75rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f3c98b, #d98f6a 70%);
      box-shadow: 0 0 40px rgba(217, 143, 106, 0.35);
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      letter-spacing: 0.02em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.35rem;
      color: #a0664c;
      margin-bottom: 1.75rem;
    }
    p { font-size: 1.05rem; line-height: 1.7; }
    .divider { width: 48px; height: 1px; background: #c9a48f; margin: 2rem auto; }
    footer { font-size: 0.85rem; color: #8a7c74; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Soulful Joyful Living</h1>
    <p class="tagline">A fresh new home is on its way</p>
    <p>We're giving our website some loving care and will be back very soon. Thank you for your patience — we can't wait to welcome you again.</p>
    <div class="divider"></div>
    <footer>&copy; 2026 Soulful Joyful Living</footer>
  </main>
</body>
</html>
